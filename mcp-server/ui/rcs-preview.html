<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCS Message Preview</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --fg: #1a1d21;
    --muted: #6b7280;
    --accent: #2563eb;
    --bubble: #e6efff;
    --bubble-fg: #0b2545;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 6px 24px rgba(0,0,0,0.08);
  }
  :root.dark {
    --bg: #0b0c0f;
    --panel: #15181d;
    --fg: #e9ecf1;
    --muted: #9aa3af;
    --bubble: #1e2a4a;
    --bubble-fg: #d6e2ff;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  .root { width: 100%; max-width: 380px; }
  .status {
    text-align: center;
    color: var(--muted);
    padding: 32px 8px;
  }
  .phone {
    background: var(--panel);
    border-radius: 28px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .phone-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .phone-header .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; }
  .phone-header .spacer { flex: 1; }
  .mode-toggle {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .mode-toggle:hover { color: var(--text); }
  .messages {
    padding: 16px 12px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    background: var(--bubble);
    color: var(--bubble-fg);
    padding: 10px 12px;
    border-radius: 14px 14px 14px 4px;
    max-width: 86%;
    align-self: flex-start;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    max-width: 92%;
    align-self: flex-start;
    box-shadow: var(--shadow);
  }
  .card-media { width: 100%; display: block; background: #eee; aspect-ratio: 16/9; object-fit: cover; }
  .card-body { padding: 10px 12px; }
  .card-title { font-weight: 600; margin: 0 0 4px 0; font-size: 15px; }
  .card-desc { margin: 0; color: var(--muted); font-size: 13px; }
  /* Suggested actions/replies — mirror the real Android RCS rendering: full-width,
     light, centered buttons with an action-type icon, stacked vertically. */
  .chips { display: flex; flex-direction: column; gap: 8px; padding: 4px 12px 12px; }
  .chip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .chip:hover { background: rgba(0,0,0,0.04); }
  :root.dark .chip:hover { background: rgba(255,255,255,0.06); }
  .chip .action-ico { display: inline-flex; color: var(--muted); }
  .chip .action-ico svg { display: block; }
  .carousel {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    scroll-snap-type: x mandatory;
  }
  .carousel .card { min-width: 240px; scroll-snap-align: start; align-self: stretch; }
  .meta {
    margin-top: 12px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  details.raw {
    margin-top: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    background: var(--panel);
  }
  details.raw summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.raw pre {
    margin: 8px 0 0 0;
    max-height: 200px;
    overflow: auto;
    font-size: 11px;
    background: rgba(0,0,0,0.04);
    padding: 8px;
    border-radius: 6px;
  }
  :root.dark details.raw pre { background: rgba(255,255,255,0.04); }
  .error { color: #c0392b; padding: 12px; background: rgba(192,57,43,0.08); border-radius: 8px; }
</style>
</head>
<body>
<div class="root" id="root">
  <div class="status" id="status">Waiting for generation…</div>
</div>
<script type="module">
// ---- Minimal MCP Apps View bridge (JSON-RPC over postMessage) ----
// Spec: https://github.com/modelcontextprotocol/ext-apps
const PROTO = '2026-01-26';
let nextId = 1;
const pending = new Map();
let hostContext = null;
let toolResultPayload = null;
let hostDisplayModes = [];        // display modes the HOST advertises support for
let currentDisplayMode = 'inline';

function hostSupports(mode) { return hostDisplayModes.includes(mode); }

// Ask the host to switch presentation (e.g. 'fullscreen' = expanded side panel,
// 'inline' = small embedded card). The host replies with the mode it actually
// set, which may differ if it declined.
async function setDisplayMode(mode) {
  try {
    const res = await request('ui/request-display-mode', { mode });
    currentDisplayMode = (res && res.mode) || mode;
  } catch (_) { /* host declined the request */ }
  if (toolResultPayload) render();
}

function send(msg) { window.parent.postMessage(msg, '*'); }
function request(method, params) {
  const id = nextId++;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    send({ jsonrpc: '2.0', id, method, params });
  });
}
function notify(method, params) {
  send({ jsonrpc: '2.0', method, params });
}

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.jsonrpc !== '2.0') return;
  if (m.id !== undefined && (m.result !== undefined || m.error !== undefined)) {
    const p = pending.get(m.id);
    if (p) {
      pending.delete(m.id);
      m.error ? p.reject(m.error) : p.resolve(m.result);
    }
    return;
  }
  if (m.method) handleNotification(m);
});

function handleNotification(m) {
  switch (m.method) {
    case 'ui/notifications/tool-result':
      toolResultPayload = m.params?.result || m.params;
      render();
      break;
    case 'ui/notifications/tool-input':
      // Could show a "generating…" state with the args
      const args = m.params?.arguments;
      if (args && !toolResultPayload) {
        document.getElementById('status').textContent = `Generating: "${args.description || ''}"…`;
      }
      break;
    case 'ui/notifications/host-context-changed':
      hostContext = { ...(hostContext || {}), ...(m.params || {}) };
      if (m.params?.availableDisplayModes) hostDisplayModes = m.params.availableDisplayModes;
      if (m.params?.displayMode) currentDisplayMode = m.params.displayMode;
      applyTheme();
      if (toolResultPayload) render();
      break;
  }
}

function applyTheme() {
  document.documentElement.classList.toggle('dark', hostContext?.theme === 'dark');
}

(async () => {
  try {
    // ext-apps `ui/initialize` requires `appInfo` + `appCapabilities` (NOT the
    // `clientInfo`/`capabilities` shape used by the base MCP initialize). The host
    // validates these against its schema and rejects the handshake otherwise —
    // which silently blocks the host from ever pushing `ui/notifications/tool-result`.
    const initResult = await request('ui/initialize', {
      protocolVersion: PROTO,
      appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
      appInfo: { name: 'sinch-rcs-preview', version: '1.0.0' },
    });
    hostContext = initResult?.hostContext || null;
    hostDisplayModes = hostContext?.availableDisplayModes || [];
    currentDisplayMode = hostContext?.displayMode || 'inline';
    applyTheme();
    notify('ui/notifications/initialized', {});
    // Auto-open in the larger panel when the host supports it. The user can
    // still collapse back to inline via the toggle in the preview header.
    if (hostSupports('fullscreen') && currentDisplayMode !== 'fullscreen') {
      setDisplayMode('fullscreen');
    }
  } catch (e) {
    // Some hosts may push tool-result without expecting ui/initialize first.
    document.getElementById('status').textContent = 'Ready (init failed, awaiting result)';
  }
})();

// ---- Rendering ----
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props);
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k);
  }
  return n;
}

function extractPayload(result) {
  // Prefer structuredContent — the server inlines card images as data: URIs there
  // (kept out of content[].text so the model doesn't pay for base64 in tokens).
  if (!result) return null;
  if (result.structuredContent && typeof result.structuredContent === 'object') {
    return result.structuredContent;
  }
  // Fallback: content[] — pull the first text block and JSON-parse it.
  const blocks = result.content || result;
  if (Array.isArray(blocks)) {
    for (const b of blocks) {
      if (b?.type === 'text' && typeof b.text === 'string') {
        try { return JSON.parse(b.text); } catch { return { raw: b.text }; }
      }
    }
  }
  if (typeof result === 'object') return result;
  return null;
}

function renderTextMessage(msg) {
  return el('div', { className: 'bubble' }, msg?.text || '');
}

function makeImg(url) {
  return Object.assign(document.createElement('img'), { src: url, alt: '', className: 'card-media', loading: 'lazy' });
}

function renderMediaMessage(msg) {
  const url = msg?.url || msg?.media_url;
  if (!url) return null;
  const isVideo = /\.(mp4|webm|mov)(\?|$)/i.test(url);
  return el('div', { className: 'card' },
    isVideo
      ? Object.assign(document.createElement('video'), { src: url, controls: true, className: 'card-media' })
      : makeImg(url),
  );
}

// Action-type icons (Android RCS shows one per suggested action; replies get none).
const ACTION_ICONS = {
  url: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>',
  dial: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.1 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  location: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
};

function choiceType(c) {
  if (c?.url_message) return 'url';
  if (c?.dial_message) return 'dial';
  if (c?.view_location_message) return 'location';
  if (c?.calendar_event_message) return 'calendar';
  return 'reply';
}

function renderChoices(choices) {
  if (!choices?.length) return null;
  const chips = el('div', { className: 'chips' });
  for (const c of choices) {
    // RCG choices wrap a typed sub-message whose label lives in `title`
    // (e.g. url_message.title, reply_message.title). Fall back to `text` and
    // bare title for other shapes.
    const sub = c?.reply_message || c?.url_message || c?.dial_message
      || c?.view_location_message || c?.calendar_event_message
      || c?.text_message || c;
    const label = sub?.title || sub?.text || c?.title || c?.text || 'Action';
    const btn = el('button', { className: 'chip' });
    const svg = ACTION_ICONS[choiceType(c)];
    if (svg) btn.appendChild(el('span', { className: 'action-ico', innerHTML: svg }));
    btn.appendChild(el('span', {}, label));
    btn.addEventListener('click', () => {
      notify('ui/message', { content: `Tapped: ${label}` });
    });
    chips.appendChild(btn);
  }
  return chips;
}

function renderCard(card) {
  const node = el('div', { className: 'card' });
  const imgUrl = card?.media_message?.url || card?.imageUrl;
  if (imgUrl) {
    node.appendChild(makeImg(imgUrl));
  }
  const body = el('div', { className: 'card-body' });
  if (card?.title) body.appendChild(el('p', { className: 'card-title' }, card.title));
  if (card?.description) body.appendChild(el('p', { className: 'card-desc' }, card.description));
  if (body.childNodes.length > 0) node.appendChild(body);
  const chips = renderChoices(card?.choices);
  if (chips) node.appendChild(chips);
  return node;
}

function renderCarousel(carousel) {
  const cards = carousel?.cards || [];
  const row = el('div', { className: 'carousel' });
  for (const c of cards) row.appendChild(renderCard(c));
  return row;
}

function renderChoiceMessage(choice) {
  const wrap = el('div', {}, el('div', { className: 'bubble' }, choice?.text_message?.text || 'Choose an option:'));
  const chips = renderChoices(choice?.choices);
  if (chips) wrap.appendChild(chips);
  return wrap;
}

function renderTemplate(template) {
  // RCG template wrapper — typically wraps a channel-specific body.
  const channel = template?.channel_template?.RCS
    || template?.RCS
    || template?.rcs
    || template;
  return renderMessageBody(channel);
}

function renderMessageBody(msg) {
  if (!msg || typeof msg !== 'object') return null;
  if (msg.text_message) return renderTextMessage(msg.text_message);
  if (msg.media_message) return renderMediaMessage(msg.media_message);
  if (msg.card_message) return renderCard(msg.card_message);
  if (msg.carousel_message) return renderCarousel(msg.carousel_message);
  if (msg.choice_message) return renderChoiceMessage(msg.choice_message);
  if (msg.template_message) return renderTemplate(msg.template_message);
  // Direct shapes:
  if (msg.text) return renderTextMessage(msg);
  if (msg.cards) return renderCarousel(msg);
  if (msg.title || msg.description || msg.media_message) return renderCard(msg);
  return null;
}

function pickRenderable(payload) {
  // Try several known shapes from the generate-rcs-message tool output.
  if (!payload) return null;
  // Direct canvas/template shapes
  if (payload.template) return payload.template;
  if (payload.canvas?.template) return payload.canvas.template;
  if (payload.canvas) return payload.canvas;
  if (payload.assistantMessage?.canvas?.template) return payload.assistantMessage.canvas.template;
  if (payload.assistantMessage?.canvas) return payload.assistantMessage.canvas;
  return payload;
}

function render() {
  const root = document.getElementById('root');
  root.replaceChildren();

  const payload = extractPayload(toolResultPayload);
  if (!payload) {
    root.appendChild(el('div', { className: 'status' }, 'No payload received.'));
    return;
  }
  if (payload.success === false) {
    root.appendChild(el('div', { className: 'error' }, `Error: ${payload.error || 'unknown'}`));
    if (payload.details) {
      const d = el('details', { className: 'raw' }, el('summary', {}, 'Details'));
      d.appendChild(el('pre', {}, JSON.stringify(payload.details, null, 2)));
      root.appendChild(d);
    }
    return;
  }

  const phone = el('div', { className: 'phone' });
  const header = el('div', { className: 'phone-header' },
    el('span', { className: 'dot' }),
    el('span', {}, 'RCS preview'),
  );
  // Expand/collapse between inline card and the larger panel, when the host
  // supports a non-inline mode.
  if (hostSupports('fullscreen')) {
    const expanded = currentDisplayMode === 'fullscreen';
    const toggle = el('button', { className: 'mode-toggle', title: expanded ? 'Collapse to inline' : 'Expand to panel' }, expanded ? 'Collapse' : 'Expand');
    toggle.addEventListener('click', () => setDisplayMode(expanded ? 'inline' : 'fullscreen'));
    header.appendChild(el('span', { className: 'spacer' }));
    header.appendChild(toggle);
  }
  const messages = el('div', { className: 'messages' });
  phone.appendChild(header);
  phone.appendChild(messages);

  const renderable = pickRenderable(payload);
  const node = renderMessageBody(renderable);
  if (node) {
    messages.appendChild(node);
  } else {
    messages.appendChild(el('div', { className: 'status' }, 'Could not infer a renderable RCS shape from the payload.'));
  }

  root.appendChild(phone);

  if (payload.conversationId) {
    root.appendChild(el('div', { className: 'meta' }, `conversationId: ${payload.conversationId}`));
  }

  const raw = el('details', { className: 'raw' }, el('summary', {}, 'Raw payload'));
  raw.appendChild(el('pre', {}, JSON.stringify(payload, null, 2)));
  root.appendChild(raw);

  // Report content height so the host can size the iframe.
  requestAnimationFrame(() => {
    const h = document.documentElement.scrollHeight;
    notify('ui/notifications/size-changed', { height: h });
  });
}
</script>
</body>
</html>
