<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Sinch Account</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0b0d12; color: #e7e9ee;
      }
      .card {
        width: 400px; max-width: calc(100vw - 32px);
        background: #151922; border: 1px solid #232838; border-radius: 14px;
        padding: 28px 26px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
      }
      .brand { font-weight: 700; font-size: 20px; letter-spacing: .5px; margin: 0 0 4px; }
      .sub { margin: 0 0 22px; color: #9aa3b2; font-size: 13px; line-height: 1.5; }
      label { display: block; font-size: 12px; color: #9aa3b2; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .5px; }
      input[type="text"], input[type="email"], input[type="password"] {
        width: 100%; padding: 11px 12px; border-radius: 9px;
        border: 1px solid #2b3144; background: #0e1117; color: #e7e9ee; font-size: 14px;
      }
      input.code-input {
        font-size: 22px; font-weight: 700; letter-spacing: 6px; text-align: center;
        text-transform: uppercase; padding: 14px 12px;
      }
      input:focus { outline: none; border-color: #4c8bf5; box-shadow: 0 0 0 3px rgba(76,139,245,.15); }
      .divider { border: none; border-top: 1px solid #232838; margin: 20px 0; }
      button {
        width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 9px;
        background: #f5a623; color: #0b0d12; font-size: 14px; font-weight: 700; cursor: pointer;
        letter-spacing: .3px;
      }
      button:hover { background: #e8971a; }
      .error {
        background: #3a1620; border: 1px solid #6b2333; color: #ffb3c0;
        padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 12px;
      }
      .step {
        display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
        background: #1a1f2e; border-radius: 9px; padding: 10px 12px;
      }
      .step-num { width: 24px; height: 24px; border-radius: 50%; background: #f5a623; color: #0b0d12; font-weight: 700; font-size: 12px; display: grid; place-items: center; flex-shrink: 0; }
      .step-txt { font-size: 13px; color: #9aa3b2; line-height: 1.4; }
      .foot { margin-top: 18px; font-size: 11px; color: #6b7385; text-align: center; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="brand">🔗 Connect Your Sinch Account</h1>
      <p class="sub">The Sinch Messaging Agent needs to access your Sinch project.</p>

      {{ERROR}}

      <form method="post" action="/device">
        <label for="user_code">Authorization Code (from the agent)</label>
        <input id="user_code" name="user_code" type="text" class="code-input"
               placeholder="SINCH-XXXX" value="{{PREFILLED_CODE}}"
               autocomplete="off" spellcheck="false" required maxlength="10" />

        <hr class="divider" />

        <label for="email">Your Sinch Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Connect Account →</button>
      </form>

      <p class="foot">Sinch Developer Portal · encrypted connection</p>
    </div>
  </body>
</html>
