name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: asein-sinch

jobs:
  auth-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth-server
        uses: docker/build-push-action@v5
        with:
          context: ./auth-server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/mcp-oauth-auth-server:latest

  mcp-jwt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mcp-server (jwt)
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          build-args: AUTH_MODE=jwt
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/mcp-oauth-mcp-jwt:latest

  mcp-static-token:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mcp-server (static-token)
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          build-args: AUTH_MODE=static-token
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/mcp-oauth-mcp-static-token:latest

  mcp-none:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mcp-server (none)
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          build-args: AUTH_MODE=none
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/mcp-oauth-mcp-none:latest

  marketplace-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push marketplace-dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./marketplace-dashboard
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/mcp-oauth-marketplace-dashboard:latest

